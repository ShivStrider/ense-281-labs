<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-Vote</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">

        <!-- Page Title -->
        <h1 class="text-center my-4">Note-Vote</h1>

        <!-- User Info Accordion -->
        <div class="accordion shadow mb-4" id="user-accordion">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#user-section">
                        <!-- Gear Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2"
                            viewBox="0 0 16 16">
                            <path
                                d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z" />
                        </svg>
                        Logged in as a@a.a
                    </button>
                </h2>
                <div id="user-section" class="accordion-collapse collapse show" data-bs-parent="#user-accordion">
                    <div class="accordion-body text-center">
                        <a href="index.html" class="btn btn-primary">Log Out</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notes Box -->
        <div class="card shadow" id="notes-box">
            <div class="card-body">

                <!-- Note: Upvoted -->
                <div class="note-row">
                    <input type="text" class="form-control" value="this is a note you upvoted" readonly>
                    <button class="btn btn-sm btn-success">↑</button>
                    <button class="btn btn-sm btn-outline-secondary">↓</button>
                    <span>1</span>
                </div>

                <!-- Note: Downvoted -->
                <div class="note-row">
                    <input type="text" class="form-control" value="this is a note you downvoted" readonly>
                    <button class="btn btn-sm btn-outline-secondary">↑</button>
                    <button class="btn btn-sm btn-danger">↓</button>
                    <span>-1</span>
                </div>

                <!-- Note: Not Voted -->
                <div class="note-row">
                    <input type="text" class="form-control" value="this is a note you haven't voted on yet" readonly>
                    <button class="btn btn-sm btn-outline-secondary">↑</button>
                    <button class="btn btn-sm btn-outline-secondary">↓</button>
                </div>

                <!-- Note: Your Own -->
                <div class="note-row">
                    <input type="text" class="form-control" value="this is a note you submitted" readonly>
                    <span>0</span>
                </div>

                <!-- Add New Note -->
                <div class="note-row">
                    <input type="text" class="form-control" placeholder="Enter a new note here">
                    <button class="btn btn-sm btn-outline-secondary">Add</button>
                </div>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
