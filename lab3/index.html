<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-Vote</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">

        <!-- Page Title -->
        <h1 class="text-center my-4">Note-Vote</h1>

        <!-- Login and Register Accordion -->
        <div class="accordion shadow" id="auth-accordion">

            <!-- Login Section -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#login-section">
                        Log In
                    </button>
                </h2>
                <div id="login-section" class="accordion-collapse collapse show" data-bs-parent="#auth-accordion">
                    <div class="accordion-body text-center">
                        <h2>Log in</h2>

                        <form>
                            <div class="mb-3">
                                <label for="login-email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="login-email" placeholder="Email address">
                            </div>

                            <div class="mb-3">
                                <label for="login-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="login-password" placeholder="Password">
                            </div>

                            <button type="submit" class="btn btn-primary">Log in</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Register Section -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#register-section">
                        Register
                    </button>
                </h2>
                <div id="register-section" class="accordion-collapse collapse" data-bs-parent="#auth-accordion">
                    <div class="accordion-body text-center">
                        <h2>Sign up</h2>

                        <form>
                            <div class="mb-3">
                                <label for="signup-email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="signup-email" placeholder="Email address">
                            </div>

                            <div class="mb-3">
                                <label for="signup-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="signup-password" placeholder="Password">
                            </div>

                            <div class="mb-3">
                                <label for="invite-code" class="form-label">Invite Code</label>
                                <input type="text" class="form-control" id="invite-code" placeholder="Invite Code">
                            </div>

                            <button type="submit" class="btn btn-primary">Sign Up</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
